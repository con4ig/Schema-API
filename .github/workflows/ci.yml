name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type Check
        working-directory: ./server
        run: npx tsc --noEmit
      - name: Lint
        working-directory: ./server
        run: npx eslint src/
      - name: Unit Tests
        working-directory: ./server
        run: npm test

  client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type Check
        working-directory: ./client
        run: npx tsc --noEmit
      - name: Lint
        working-directory: ./client
        run: npm run lint
